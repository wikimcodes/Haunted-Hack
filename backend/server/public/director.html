<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090909">
  <title>Director View — The Spy Monster</title>
  <style>body{margin:0;background:#090909;color:#ededed;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.boot-message{padding:40px;color:#a0a0a5}svg{max-width:100%}</style>
  <script>
    const directorPrefix = location.pathname.replace(/\/director\/?$/, "").replace(/\/$/, "")
    const directorStyle = document.createElement("link")
    directorStyle.rel = "stylesheet"
    directorStyle.href = directorPrefix + "/director.css"
    document.head.append(directorStyle)
  </script>
</head>
<body data-view="overview">
  <a class="skip-link" href="#root">Skip to investigation</a>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="#overview" aria-label="The Spy Monster, Director overview">
        <span class="brand-icon" aria-hidden="true"><svg width="31" height="31" viewBox="0 0 32 32" fill="none"><path d="M7 24V8l9 10V8l9 16V8" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/><path d="m7 24 9-6 9 6" stroke="currentColor" stroke-width="1.1" opacity=".45"/></svg></span>
        <span>SPY MONSTER<small>DIRECTOR WORKSPACE</small></span>
      </a>
      <nav class="topnav" aria-label="Director sections">
        <a href="#overview" data-view="overview" aria-current="page">Overview</a>
        <a href="#messages" data-view="messages">Relay messages</a>
        <a href="#timeline" data-view="timeline">Timeline</a>
      </nav>
      <div class="topbar-meta"><span class="readonly"><svg width="13" height="13" viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="4" y="8" width="12" height="9" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M7 8V5a3 3 0 0 1 6 0v3" stroke="currentColor" stroke-width="1.5"/></svg> Read only</span><span class="workspace-avatar" aria-hidden="true">D</span></div>
    </header>

    <section class="page-head" aria-label="Investigation controls">
      <div class="heading-block"><p class="eyebrow">THE FORGOTTEN LIBRARY / DIRECTOR VIEW</p><h1>Investigation overview</h1><p class="page-subtitle">Every whisper leaves a trace.</p></div>
      <div class="page-actions">
        <label class="session-field"><span>Session</span><select id="picker" aria-label="Game"><option>Loading sessions…</option></select></label>
        <button id="refresh" class="button button-primary" type="button"><svg width="15" height="15" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M16.3 7A6.5 6.5 0 1 0 16 14M16.5 3.5V7H13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Refresh</span></button>
        <span id="connection" class="badge connection" role="status">Connecting</span>
      </div>
    </section>

    <main id="root" tabindex="-1" aria-label="Director dashboard"><div class="boot-message" role="status">Opening the investigation…</div></main>
  </div>
  <noscript><p class="boot-message">Enable JavaScript to inspect the investigation.</p></noscript>
  <script>
    const directorScript = document.createElement("script")
    directorScript.type = "module"
    directorScript.src = directorPrefix + "/director.js"
    directorScript.onerror = () => {
      const message = document.createElement("p")
      message.className = "error-state boot-message"
      message.setAttribute("role", "alert")
      message.textContent = "The dashboard could not load. Reload this page to try again."
      document.getElementById("root").replaceChildren(message)
    }
    document.body.append(directorScript)
  </script>
</body>
</html>
